services:

  aegisops:
    build: .
    container_name: aegisops-app
    ports:
      - "5000:5000"

  prometheus:
    image: prom/prometheus
    container_name: aegisops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - aegisops
  
  grafana:
    image: grafana/grafana
    container_name: aegisops-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana-data: